version: '3.9'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: docdoc
      POSTGRES_PASSWORD: docdoc
      POSTGRES_DB: docdoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://docdoc:docdoc@postgres:5432/docdoc?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
